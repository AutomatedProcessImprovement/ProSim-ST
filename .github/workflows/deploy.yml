name: CI + VPS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-nextjs-main
  cancel-in-progress: false

jobs:
  test-and-migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start MySQL for CI
        env:
          CI_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          CI_MYSQL_DATABASE: ${{ vars.CI_MYSQL_DATABASE }}
          CI_MYSQL_USER: ${{ secrets.CI_MYSQL_USER }}
          CI_MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
        run: |
          docker rm -f ci-mysql >/dev/null 2>&1 || true

          docker run -d \
            --name ci-mysql \
            -e MYSQL_ROOT_PASSWORD="$CI_MYSQL_ROOT_PASSWORD" \
            -e MYSQL_DATABASE="$CI_MYSQL_DATABASE" \
            -e MYSQL_USER="$CI_MYSQL_USER" \
            -e MYSQL_PASSWORD="$CI_MYSQL_PASSWORD" \
            -p 3306:3306 \
            mysql:8.0

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent; then
              echo "MySQL is up"
              exit 0
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL did not become ready in time"
          docker logs ci-mysql || true
          exit 1

      - name: Run tests
        run: npm test -- --runInBand

      - name: Run migrations
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.CI_MYSQL_DATABASE }}
          TYPEORM_SYNCHRONIZE: "false"
          TYPEORM_LOGGING: "false"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          REDIS_EXPIRY_MS: PX
          REDIS_MAX_AGE: ""
          PYTHON_MICROSERVICE_BASE_URL: http://127.0.0.1:8000
        run: npm run migrate:run

      - name: Stop CI MySQL
        if: always()
        run: |
          docker rm -f ci-mysql >/dev/null 2>&1 || true

  deploy-to-vps:
    runs-on: ubuntu-latest
    needs: test-and-migrate
    environment: production

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_BRANCH: main
          DEPLOY_PATH: ${{ vars.VPS_NEXTJS_APP_DIR }}
          IMAGE_NAME: ${{ vars.NEXTJS_IMAGE_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          envs: DEPLOY_BRANCH,DEPLOY_PATH,IMAGE_NAME
          script: |
            set -euo pipefail

            cd "$DEPLOY_PATH"
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            docker build -t "$IMAGE_NAME" .

            cd ~/app
            docker compose up -d mysql_nextjs redis
            docker compose run --rm nextjs npm run migrate:run
            docker compose up -d nextjs

            docker image prune -f